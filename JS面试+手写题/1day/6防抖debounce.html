<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function debounce(fn, delay) {
            let id = null
            return function (...args) {
                let that = this
                clearTimeout(id)
                id = setTimeout(function () {
                    fn.apply(that, args)
                }, delay)
            }
        }

        const msg = (str) => {
            console.log(str);
        }
        const fn = debounce(msg, 1000)
        fn('hello')
        fn('world')
    </script>
</body>

</html>
